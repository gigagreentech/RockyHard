# Hardening Script Configuration
# Set each module to "yes" to enable or "no" to disable

# ---- Modules ----
# hostname        : Set the system hostname via hostnamectl and update /etc/hosts
#                   for local resolution — no reboot required.
MODULE_HOSTNAME=yes

# smtp_relay      : Install and configure msmtp as an SMTP relay — set relay host,
#                   credentials, and TLS; send a test email to verify delivery.
MODULE_SMTP_RELAY=yes

# password_policy : Configures four system-wide password controls:
#                     Complexity   — pwquality.conf (minlen, digit, upper, lower, special char)
#                     Aging        — login.defs (max age, min age, expiry warning)
#                     Lockout      — faillock.conf (lock after 5 failed attempts, unlock after 15 min)
#                     Reuse        — pam_pwhistory (rejects the last 5 passwords)
#                   Operator can apply default values or configure each interactively.
#                   Saves a timestamped policy artifact to hardening/artifacts/ on completion.
#                   Run before users so new accounts inherit these settings.
MODULE_PASSWORD_POLICY=yes

# users           : Interactively create an admin (wheel/sudo) or standard (no-sudo) user.
#                   Prompts for username and password, forces a reset at first login,
#                   and optionally locks the root account.
MODULE_USERS=yes

# mfa             : Install pam_google_authenticator and configure TOTP-based MFA.
#                   Enforces MFA on SSH logins (publickey + OTP) and/or sudo.
#                   Per-user enrollment via google-authenticator CLI with QR code output.
#                   nullok grace mode lets unenrolled users log in during rollout.
MODULE_MFA=yes

# logon_banner    : Writes a legal warning banner to /etc/issue (local console pre-login)
#                   and /etc/issue.net (network/SSH pre-login), and sets the Banner
#                   directive in sshd_config. Operator chooses the DEI standard banner
#                   or provides custom text (typed inline or loaded from a file).
MODULE_LOGON_BANNER=yes

# antivirus       : Install and configure an antivirus solution. Operator selects
#                   ClamAV (open-source, native Rocky support) or Microsoft Defender
#                   for Endpoint (MDE for Linux, requires Defender for Servers licence).
#                   Configures behaviour settings, automatic definition updates, and
#                   a systemd scan timer that logs timestamped evidence of routine scanning.
MODULE_ANTIVIRUS=yes

# usb_control     : Restrict USB mass storage access. Two modes: full block (prevents
#                   usb_storage and uas kernel modules from loading via modprobe.d) or
#                   whitelist (udev rules deny all USB storage except operator-approved
#                   Vendor ID:Product ID pairs). Operator selects mode and approves
#                   devices interactively.
MODULE_USB_CONTROL=yes

# session_timeout : Enforce automatic session termination after SESSION_TIMEOUT seconds
#                   of inactivity across SSH (ClientAliveInterval/ClientAliveCountMax),
#                   local console/shell (TMOUT via /etc/profile.d/), and GUI desktop
#                   sessions (GNOME idle-delay + screen lock via dconf).
#                   Satisfies CMMC AC.L2-3.1.11 (Session Termination).
MODULE_SESSION_TIMEOUT=yes

# networking      : Configure network interfaces via NetworkManager (nmcli).
#                   Set a static IP address (IP, prefix, gateway, DNS) or switch to
#                   DHCP on any managed ethernet or Wi-Fi interface.
MODULE_NETWORKING=yes

# firewall        : Enable and configure firewalld.  Start/stop the service,
#                   add/remove services (ssh, http, https, etc.), open/close
#                   custom ports, and set the default zone.
MODULE_FIREWALL=yes

# packages        : Remove known unnecessary packages (telnet, rsh, etc.) and disable
#                   unused services to reduce the attack surface.
MODULE_PACKAGES=no

# filesystem      : Restrict permissions on sensitive files (/etc/passwd, shadow, sudoers);
#                   apply noexec/nosuid/nodev mount options to /tmp, /var/tmp, /dev/shm.
MODULE_FILESYSTEM=no

# auditd          : Install and enable auditd; deploy a baseline ruleset covering logins,
#                   privilege escalation, user/group changes, and sensitive file access.
MODULE_AUDITD=no

# encryption      : OS drive FDE status, second boot passphrase, recovery keyfile backup,
#                   data disk encryption (LUKS2 format/open/close), and FDE setup guide.
MODULE_ENCRYPTION=yes

# fips            : Run a 5-point FIPS compliance check — kernel flag, fips-mode-setup,
#                   boot cmdline, system crypto policy, and /etc/system-fips marker.
#                   Set ENABLE_FIPS=yes below to also activate FIPS if not already enabled.
MODULE_FIPS=yes

# updates         : Detect package manager (dnf/yum/apt), list pending updates, apply all
#                   available updates, and check whether a reboot is required.
MODULE_UPDATES=yes

# time_sync       : Configure the system time source. Select NTP servers from presets
#                   (NTP Pool Project, Cloudflare, Google, NIST) or enter custom addresses.
#                   Optionally set the system timezone. Detects and configures chrony,
#                   ntpd, or systemd-timesyncd automatically; verifies clock synchronisation.
MODULE_TIME_SYNC=yes

# ---- Password Policy Module ----
# Run password_policy before users so new accounts inherit these defaults.

# ---- Users Module ----
# Name of the new administrator account to create
ADMIN_USERNAME="admin"

# Add to sudoers group (wheel on RHEL/Rocky, sudo on Debian)
ADMIN_GROUP="wheel"

# Lock the root account after creating the admin user
LOCK_ROOT=yes

# Minimum password length enforced via PAM
MIN_PASSWORD_LENGTH=8

# ---- ClamAV Module ----
CLAMAV_ON_ACCESS=no             # yes = real-time on-access scanning (performance impact)
CLAMAV_ON_ACCESS_PATHS="/home /tmp"  # paths monitored when on-access is enabled
CLAMAV_SCAN_SCHEDULE=daily      # daily or weekly
CLAMAV_SCAN_HOUR=2              # hour to run scheduled scan (0-23)
CLAMAV_SCAN_DAY=Sunday          # day for weekly scans (Monday-Sunday)
CLAMAV_SCAN_PATHS="/home /tmp /var/tmp"
CLAMAV_MAX_FILE_SIZE=100        # MB — skip files larger than this
CLAMAV_MAX_RECURSION=10         # max archive recursion depth (1-30)
CLAMAV_SCAN_ARCHIVES=yes        # scan inside zip/tar/etc archives
CLAMAV_DETECT_PUA=yes           # detect potentially unwanted applications
CLAMAV_ALERT_BROKEN=yes         # alert on broken/malformed PE and ELF files
CLAMAV_QUARANTINE_DIR=""        # move infected files here — leave empty to disable
CLAMAV_LOG_VERBOSE=no           # verbose clamd logging
CLAMAV_DEF_UPDATES=24           # definition update checks per day (max 24)

# Alerting — fires on detection by real-time daemon (VirusEvent) and scheduled scan
CLAMAV_ALERT_EMAIL=""           # email address for threat alerts — leave empty to disable
CLAMAV_ALERT_SYSLOG=yes         # log detections to syslog via logger
CLAMAV_ALERT_SLACK=""           # Slack incoming webhook URL — leave empty to disable
CLAMAV_ALERT_CUSTOM=""          # custom command: use %v for virus name, %f for file path

# ---- MDE Module ----
# Release channel: production (stable/GA), insiders-slow, insiders-fast
# Network protection requires insiders-slow or insiders-fast — it will not run on production.
MDE_RELEASE_CHANNEL=production

# Protection
MDE_REAL_TIME_PROTECTION=enabled  # enabled or disabled
MDE_PASSIVE_MODE=disabled         # enabled if ClamAV is also active (avoids AV conflicts)
MDE_CLOUD_ENABLED=enabled         # enabled or disabled
MDE_PUA_ACTION=block              # block or audit
MDE_BEHAVIOR_MONITORING=enabled   # enabled or disabled — behavioural EDR analytics
MDE_NETWORK_PROTECTION=block      # block / audit / disabled — requires insiders channel
MDE_AUTO_SAMPLE_SUBMISSION=enabled # enabled or disabled — sends suspicious files to GCCH cloud

# Diagnostics
MDE_LOG_LEVEL=info                # debug / info / warning / error / critical / disabled
MDE_CLOUD_DIAGNOSTIC=enabled      # enabled or disabled — extended portal telemetry

# Exclusions (space-separated; leave empty for none)
MDE_EXCL_FOLDERS=""               # e.g. "/opt/myapp /data/backups"
MDE_EXCL_EXTENSIONS=""            # e.g. ".log .tmp .bak"
MDE_EXCL_PROCESSES=""             # e.g. "backup.sh rsync"

# Network
MDE_PROXY=""                      # e.g. https://proxy.host:8080 — leave empty if not needed

# Scheduling
MDE_SCAN_TYPE=full                # quick or full for scheduled scans
MDE_SCAN_SCHEDULE=daily           # daily or weekly
MDE_SCAN_HOUR=2                   # hour to run scan (0-23)
MDE_SCAN_DAY=Sunday               # day for weekly scans (Monday-Sunday)

# ---- Session Timeout Module ----
# Idle timeout in seconds applied to SSH, shell/console, and GUI sessions.
# 900 = 15 minutes.  Change this value to adjust the timeout across all three
# enforcement points simultaneously.
SESSION_TIMEOUT=900

# ---- Updates Module ----
# Set APPLY_UPDATES=no to check for updates without installing them.
APPLY_UPDATES=yes

# ---- Time Sync Module ----
# Leave TIME_SERVERS empty to be prompted at runtime.
# Space-separated list of NTP server hostnames or IPs.
TIME_SERVERS=""                 # e.g. "ntp1.example.com ntp2.example.com"
TIME_TIMEZONE=""                # e.g. UTC, America/New_York — empty = keep current timezone
TIME_IBURST=yes                 # yes = pass iburst to server/pool directives (faster initial sync)

# ---- FIPS Module ----
# Check whether FIPS mode is active on this system.
# Set ENABLE_FIPS=yes to also enable it if not already active (requires reboot).
ENABLE_FIPS=no

# ---- MFA Module ----
# MFA_ENFORCE_SSH=yes enforces publickey+TOTP for every SSH login.
# MFA_ENFORCE_SUDO=yes requires a TOTP code before privilege escalation.
# MFA_NULLOK=yes allows users without a token to log in (use during rollout).
# Set MFA_NULLOK=no once all users have completed enrollment.
MFA_ENFORCE_SSH=yes
MFA_ENFORCE_SUDO=no
MFA_NULLOK=yes          # set to no once all users are enrolled
MFA_TOTP_WINDOW=1       # ±1 time step (30 s each side of current time)
MFA_RATE_LIMIT="3 30"   # max 3 OTP attempts per 30 seconds
MFA_EMERGENCY_CODES=5   # scratch codes generated per user during enrollment

# ---- Logging ----
LOG_FILE="/var/log/hardening.log"
